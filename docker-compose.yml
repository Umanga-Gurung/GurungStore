services:
  db:
    image: postgres:15-alpine
    container_name: gurungstore_db_container
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-gurungstore_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gurungstore_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: gurungstore_web_container
    restart: always
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
