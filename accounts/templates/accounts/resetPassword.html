{% extends "base.html" %}

{% block content %}
<main class="offcanvas-enabled" style="padding-top: 5rem;">
  <section class="ps-lg-4 pe-lg-3 pt-4" style="min-height:84vh">
    <div class="card mx-auto shadow-sm rounded-3 border-0" style="max-width: 400px; margin-top:60px;">
      <div class="card-body p-4">
        <h4 class="card-title fw-bold mb-3">Reset Password</h4>
        <div class="mb-3">
          {% include "accounts/alert.html" %}
        </div>
        <form action="{%url 'reset-password'%}" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fs-sm fw-medium">Create Password</label>
            <input type="password" class="form-control" placeholder="Enter new password" name="password" required>
          </div>
          <div class="mb-4">
            <label class="form-label fs-sm fw-medium">Confirm Password</label>
            <input type="password" class="form-control" placeholder="Confirm new password" name="confirm_password" required>
          </div>
          <div class="mb-3">
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Reset Password</button>
          </div>
        </form>
      </div>
    </div>
    
    <p class="text-center mt-4">Don't have account? <a href="{%url 'register'%}" class="fw-bold">Sign up</a></p>
    <br><br>
  </section>
</main>
{% endblock content %}
