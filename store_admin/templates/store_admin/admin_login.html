<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | GurungStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem 2rem;
        }
        .login-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem;
            box-shadow: 0 8px 24px rgba(79,70,229,0.3);
        }
        .login-icon i { font-size: 2rem; color: #fff; }
        .btn-admin {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.65rem;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-admin:hover {
            background: linear-gradient(135deg, #4338ca, #6d28d9);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(79,70,229,0.4);
        }
        .form-control:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129,140,248,0.25);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h4 class="text-center fw-bold mb-1">Store Admin Portal</h4>
        <p class="text-center text-muted mb-4" style="font-size: 0.85rem;">
            Sign in to access the GurungStore administration panel.
        </p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'danger' }} py-2 mb-3" style="font-size: 0.85rem;" role="alert">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-medium" style="font-size: 0.85rem;">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control border-start-0" placeholder="admin@gurungstore.com" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium" style="font-size: 0.85rem;">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-admin w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In to Admin Portal
            </button>
        </form>

        <div class="text-center">
            <a href="/" class="text-decoration-none text-muted" style="font-size: 0.8rem;">
                <i class="bi bi-arrow-left me-1"></i>Back to Store
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
